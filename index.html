<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Search</title>
    <link rel="stylesheet" href="google.css">
  </head>
  <body>
    <main class="main">
      <img class="logo" src="google.png" alt="Google">
      <form action="https://www.google.com/search" method="get">
        <input
          class="search"
          type="search"
          name="q"
          aria-label="Search"
          placeholder="Search"
        >
        <div class="gap">
          <button class="button" type="submit">Google Search</button>
          <button class="button" type="submit" name="btnI" value="1">I'm Feeling Lucky</button>
        </div>
      </form>
    </main>
  </body>
</html>
